name: Publish

# Every push to the AV-Code branch builds the Windows installer and publishes it as a new
# GitHub Release. Installed copies of the app find it within the hour and
# update themselves. No version bump or tag is needed: the patch number
# is the workflow run number, so each publish is automatically newer.
# (Pushing a tag like v1.0.0 publishes exactly that version instead.)
on:
  push:
    branches: [AV-Code]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Choose the version number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            VERSION="$BASE.${{ github.run_number }}"
          fi
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Point the build at this repository
        run: node scripts/configure-updates.js ${{ github.repository }}

      - name: Build and publish installer
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
