name: Publish

# Publishing only happens on purpose: run this workflow from the Actions tab
# ("Run workflow"), or push a tag like v1.0.0. Pushing code alone does NOT publish.
# The version is chosen automatically (patch = run number), so each publish is newer.
# Installed apps then find it within the hour, show what changed, and ask the user
# before updating.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, used to write the release notes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Choose the version number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            VERSION="$BASE.${{ github.run_number }}"
          fi
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Point the build at this repository
        run: node scripts/configure-updates.js ${{ github.repository }}

      - name: Build and publish installer
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes (what changed since the last release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          PREV=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV"..HEAD --no-merges --pretty='- %s' | grep -vi '^- publish' || true)
          else
            LOG=$(git log -10 --no-merges --pretty='- %s')
          fi
          if [ -z "$LOG" ]; then LOG="- Maintenance update"; fi
          printf '%s\n' "$LOG" > notes.md
          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
